workflows:
  default-workflow:
    name: BikeMedic Android Build
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Initialize Android Structure
        script: |
          flutter create . --org com.bikemedic.app --project-name bikemedic --platforms android
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      
